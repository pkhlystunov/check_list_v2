<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль ОТиПБ</title>
    <style>
        :root { --primary: #2c3e50; --success: #2ecc71; --danger: #e74c3c; --secondary: #7f8c8d; --gray: #bdc3c7; --bg: #ecf0f1; }
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: var(--bg); color: #333; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: 0 auto; }
        h2, h3 { text-align: center; color: var(--primary); }
        .card { background: #fff; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 6px solid var(--gray); position: relative; }
        .primary-border { border-left-color: var(--primary); }
        .audit-header { border-left-color: #2980b9; background: #eaf2f8; font-size: 14px; }
        .audit-header p { margin: 6px 0; }
        label { display: block; margin-top: 15px; margin-bottom: 4px; font-weight: 600; color: #444; }
        input[type="text"], select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--gray); border-radius: 6px; box-sizing: border-box; font-size: 15px; background: #fff; }
        .btn { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; transition: opacity 0.15s; text-align: center; width: 100%; box-sizing: border-box;}
        .btn:hover { opacity: 0.95; }
        .btn:disabled { background: var(--gray) !important; cursor: not-allowed; }
        .btn-success { background: var(--success); color: white; margin-bottom: 8px; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .comment-box { display: none; margin-top: 12px; border-color: var(--danger); background: #fdf2f2; }
        .badge { display: inline-block; background: #ebf5fb; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #2980b9; text-transform: uppercase; }
        .normative-text { font-size: 13px; color: #555; margin-top: 10px; background: #f8f9f9; padding: 10px; border-radius: 5px; border-left: 3px solid #3498db; }
        .loading-overlay { text-align: center; font-style: italic; color: #666; padding: 30px 10px; font-size: 15px; }
        .meta-info { font-size: 13px; color: var(--secondary); text-align: center; margin-top: -8px; margin-bottom: 15px; }
        .error-log { background: #fadbd8; border: 1px solid var(--danger); color: #78281f; padding: 15px; border-radius: 6px; margin-top: 15px; display: none; font-family: monospace; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 Контроль Охраны Труда и ПБ</h2>
    
    <!-- ШАГ 1: Ввод инспектора, Объекта и Подрядчика -->
    <div id="step-1-form" class="card primary-border">
        <div class="loading-overlay" id="setup-loading">⏳ Подключение к реестрам Google Таблиц...</div>
        
        <div id="form-fields-wrapper" style="display:none;">
            <label for="inspector"><b>ФИО Проверяющего сотрудника:</b></label>
            <input type="text" id="inspector" placeholder="Например, Хлыстунов П.А.">
            
            <label for="object-select"><b>Объект строительства (Лист 1_Объекты):</b></label>
            <select id="object-select"><option value="">-- Выберите объект --</option></select>
            
            <label for="contractor-select"><b>Подрядная организация (Лист 2_Подрядчики):</b></label>
            <select id="contractor-select"><option value="">-- Выберите подрядчика --</option></select>
            
            <button onclick="goToStep2()" class="btn btn-primary" style="margin-top: 15px;">Далее к выбору чек-листа →</button>
        </div>
        
        <!-- Блок вывода ошибок при сбоях сети -->
        <div id="error-display" class="error-log"></div>
    </div>

    <!-- ШАГ 2: Выбор Раздела из 3_Чек_лист -->
    <div id="step-2-form" class="card primary-border" style="display:none;">
        <h3>Выбор раздела чек-листа</h3>
        <p class="meta-info">Объект: <span id="meta-obj"></span> | Подрядчик: <span id="meta-contr"></span></p>
        
        <label for="category-select"><b>Выберите направление проверки (Лист 3_Чек_лист):</b></label>
        <select id="category-select"><option value="Все разделы">-- Загрузить все вопросы --</option></select>
        
        <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="startAudit()" class="btn btn-primary">Начать аудит 🚀</button>
            <button onclick="backToStep1()" class="btn btn-secondary">← Назад</button>
        </div>
    </div>

    <!-- ШАГ 3: Прохождение чек-листа -->
    <div id="step-3-checklist" style="display:none;">
        <div class="audit-header card">
            <p>👤 <b>Инспектор:</b> <span id="audit-meta-insp"></span></p>
            <p>🏗️ <b>Объект:</b> <span id="audit-meta-obj"></span></p>
            <p>🚜 <b>Подрядчик:</b> <span id="audit-meta-contr"></span></p>
            <p>📂 <b>Раздел:</b> <span id="audit-meta-cat"></span></p>
        </div>
        
        <div id="questions-container"></div>
        
        <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="submitAudit()" id="submit-btn" class="btn btn-primary" style="background: #27ae60;">Сохранить аудит в Google Таблицу</button>
            <button onclick="backToStep2()" class="btn btn-secondary">Изменить раздел</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ ВСТАВЬТЕ СЮДА ВАШ СВЕЖИЙ URL ПОСЛЕ ПЕРЕДЕПЛОЯ ИЗ ШАГА 1
    const API_URL = "https://script.google.com/macros/s/AKfycbz2etXhD_o2AxHQtlaxnlv4fxb8PzBWi9qt9cUzxrBKkMjczHHuIg2B6KAeRpZiS7AP/exec"; 
    
    let auditSession = { inspector: '', objectName: '', contractor: '', category: '', results: [] };

    document.addEventListener("DOMContentLoaded", async function() {
        const errorDiv = document.getElementById('error-display');
        const loadingEl = document.getElementById('setup-loading');
        
        // Предохранитель зависания: если за 10 секунд Google не ответит, принудительно выводим ошибку
        const timeoutId = setTimeout(() => {
            if (loadingEl.style.display !== 'none') {
                loadingEl.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `<b>🔴 Превышено время ожидания ответа сервера (Timeout 10s)</b>\n\nGoogle Таблица слишком долго отвечает. Пожалуйста, вернитесь в Apps Script, нажмите <b>Развернуть -> Управление развертываниями</b>, удалите старые деплои и создайте <b>Новое развертывание</b> с правами доступа "Все (Anyone)".`;
            }
        }, 10000);

        try {
            const response = await fetch(`${API_URL}?action=getSetupData`, { method: "GET", redirect: "follow" });
            clearTimeout(timeoutId);
            
            const rawText = await response.text();
            
            // Если вместо JSON пришла страница авторизации Google
            if (rawText.includes("Google Accounts") || rawText.includes("Sign in")) {
                throw new Error("Доступ заблокирован защитой Google. Макрос требует войти в аккаунт. Перевыпустите деплой скрипта строго по инструкции для 'Anyone' (Все).");
            }
            
            const res = JSON.parse(rawText);
            if (!res.success) throw new Error(res.error || "Неизвестная ошибка на стороне макроса");
            
            const objectSelect = document.getElementById('object-select');
            res.objects.forEach(obj => {
                const opt = document.createElement('option');
                opt.value = obj.name; opt.textContent = `${obj.id} | ${obj.name}`;
                objectSelect.appendChild(opt);
            });
            
            const contractorSelect = document.getElementById('contractor-select');
            res.contractors.forEach(contr => {
                const opt = document.createElement('option');
                opt.value = contr; opt.textContent = contr;
                contractorSelect.appendChild(opt);
            });
            
            const categorySelect = document.getElementById('category-select');
            res.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
            
            loadingEl.style.display = 'none';
            document.getElementById('form-fields-wrapper').style.display = 'block';
        } catch (error) {
            clearTimeout(timeoutId);
            loadingEl.style.display = 'none';
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `<b>❌ Ошибка инициализации API:</b>\n${error.message}\n\n<b>Как исправить:</b>\nУбедитесь, что вы скопировали ссылку из окна деплоя, а не из адресной строки браузера при редактировании скрипта. Ссылка должна содержать подстроку <code>/macros/s/.../exec</code>.`;
        }
    });

    function goToStep2() {
        const insp = document.getElementById('inspector').value.trim();
        const obj = document.getElementById('object-select').value;
        const contr = document.getElementById('contractor-select').value;
        if(!insp || !obj || !contr) return alert("Заполните ФИО и выберите Объект и Подрядчика!");
        
        auditSession.inspector = insp; auditSession.objectName = obj; auditSession.contractor = contr;
        document.getElementById('meta-obj').textContent = obj;
        document.getElementById('meta-contr').textContent = contr;
        document.getElementById('step-1-form').style.display = 'none';
