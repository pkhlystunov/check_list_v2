<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль ОТиПБ</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем скрипт генерации PDF -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="container">
    <h2>📋 Контроль Охраны Труда и ПБ</h2>
    
    <!-- ШАГ 1: Ввод инспектора, выбор Объекта и Подрядчика -->
    <div id="step-1-form" class="card primary-border">
        <div class="loading-overlay" id="setup-loading">⏳ Подключение к реестрам Google Таблиц...</div>
        
        <div id="form-fields-wrapper" style="display:none;">
            <label for="inspector"><b>ФИО Проверяющего сотрудника:</b></label>
            <input type="text" id="inspector" placeholder="Например, Хлыстунов П.А.">
            
            <label for="object-select"><b>Объект строительства (Лист 1_Объекты):</b></label>
            <select id="object-select">
                <option value="">-- Выберите объект --</option>
            </select>
            
            <label for="contractor-select"><b>Подрядная организация (Лист 2_Подрядчики):</b></label>
            <select id="contractor-select">
                <option value="">-- Выберите подрядчика --</option>
            </select>
            
            <button onclick="startFullAudit()" class="btn btn-primary" style="margin-top: 15px;">Начать аудит (Загрузить чек-лист) 🚀</button>
        </div>
        
        <div id="error-display" class="error-log"></div>
    </div>

    <!-- ШАГ 2: Экран прохождения полного чек-листа -->
    <div id="step-3-checklist" style="display:none;">
        <!-- Обертка, которая пойдет на печать в PDF -->
        <div id="pdf-printable-area">
            <div class="audit-header card">
                <h3 style="margin-top:0; color:#2c3e50;">АКТ ПРОВЕРКИ ОТиПБ</h3>
                <p>👤 <b>Инспектор:</b> <span id="audit-meta-insp"></span></p>
                <p>🏗️ <b>Объект:</b> <span id="audit-meta-obj"></span></p>
                <p>🚜 <b>Подрядчик:</b> <span id="audit-meta-contr"></span></p>
                <p>📅 <b>Дата:</b> <span id="audit-meta-date"></span></p>
            </div>
            
            <div id="questions-container"></div>
        </div>
        
        <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="submitAudit()" id="submit-btn" class="btn btn-primary" style="background: #27ae60;">Сохранить в Реестр и Скачать PDF 📄</button>
            <button onclick="backToStep1()" class="btn btn-secondary">← Назад к выбору объекта</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
